aid: bankiom
name: Bankiom
description: >-
  Bankiom is a Dubai-based consumer fintech founded in 2018 by Danny Abla. It
  began as a UAE/GCC lifestyle neobank offering free virtual prepaid Mastercard
  cards, multi-bank account aggregation, spending insights, and instant peer
  transfers through a mobile app across the UAE, Saudi Arabia, Bahrain, Kuwait,
  and Oman. Bankiom has since repositioned as an autonomous AI money agent that
  securely connects to a user's bank, audits roughly 90 days of transactions,
  and surfaces the fees, interest, unused rewards, forgotten subscriptions, and
  expiring loyalty points a customer should not be paying, charging only a
  capped share of verified savings. It is a consumer-facing application and does
  not publish a public developer API, SDKs, or developer portal at this time.
